<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装备合成路线 · 映照诸天3</title>
<style>
:root{color-scheme:dark;--bg:#111615;--pane:#191f1d;--pane-2:#212925;--line:#344139;--text:#f2f3e9;--muted:#adbaae;--gold:#ecd492;--green:#b2debb;--green-2:#2b4435;--focus:#f4d07c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 76% -20%,#2c3e30 0%,transparent 49%),var(--bg);color:var(--text);font:15px/1.6 "DM Sans","Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
a{color:var(--green);text-underline-offset:.2em}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
button{border:1px solid var(--line);border-radius:7px;background:var(--pane-2)}
button:hover,select:hover{border-color:#69836e}
button[aria-pressed="true"]{background:var(--green-2);color:#d7f5db;border-color:#4a6e55}
h1,h2,h3,h4,p{margin:0}
header,.shell,.foot{width:min(1440px,calc(100% - 64px));margin:auto}
header{padding:46px 0 26px;display:flex;justify-content:space-between;align-items:end;gap:26px;border-bottom:1px solid var(--line)}
.mapname{color:var(--gold);font-size:13px;letter-spacing:.12em}
h1{font-size:clamp(30px,4vw,52px);line-height:1.18;letter-spacing:.02em;margin:7px 0 10px}
.sub{color:var(--muted);font-size:14px}
.summary{display:flex;gap:26px;color:var(--muted);white-space:nowrap;font-size:12px}
.summary b{display:block;color:var(--gold);font-size:29px;font-weight:650;line-height:1.2}
.shell{display:grid;grid-template-columns:minmax(300px,330px) minmax(0,1fr);gap:24px;align-items:start;padding-top:23px}
.sidebar,.card{background:var(--pane);border:1px solid var(--line);border-radius:12px}
.sidebar{position:sticky;top:16px;overflow:hidden}
.filterbar{padding:17px 15px 12px}
.searchlabel{display:block;font-weight:650;margin-bottom:8px}
.search{width:100%;height:42px;border:1px solid var(--line);border-radius:7px;background:#111815;padding:0 11px;min-width:0;color:var(--text)}
.search::placeholder{color:#a5b1a7}
.scope{display:flex;gap:5px;margin:10px 0}
.scope button{flex:1;font-size:13px;padding:6px 2px;white-space:nowrap}
.filters{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:12px;color:var(--muted);font-size:12px}
select{border:1px solid var(--line);border-radius:6px;background:var(--pane-2);min-width:0;padding:5px 6px}
.index{overflow:auto;max-height:max(320px,calc(100vh - 374px));border-top:1px solid var(--line);padding:6px 7px 9px}
.item-index{width:100%;display:flex;justify-content:space-between;gap:7px;text-align:left;align-items:center;padding:8px 8px;margin:1px 0;border:1px solid transparent;background:transparent;line-height:1.35;color:var(--text)}
.item-index:hover{background:var(--pane-2)}
.item-index[aria-current="true"]{background:var(--green-2);border-color:#4a6e55;color:#e9f8e9}
.item-index > span{min-width:0;overflow-wrap:anywhere}
.grade{font-size:11px;display:inline-block;border-radius:20px;white-space:nowrap;border:1px solid #6b634a;color:var(--gold);padding:2px 7px;background:#2f2b21;font-weight:500}
.grade[data-rank="普通"],.grade[data-rank="精良"]{color:#cfddd2;background:#27362e;border-color:#465e50}
.grade[data-rank="稀有"],.grade[data-rank="史诗"]{color:#ded0fa;background:#312a43;border-color:#645382}
.empty{padding:16px;color:var(--muted)}
main{min-width:0;display:grid;gap:15px}
.card{padding:19px 22px}
.selected{background:linear-gradient(112deg,#232e27 0%,#191f1d 75%);border-color:#435749}
.title-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px 10px}
h2{font-size:clamp(22px,3vw,34px);line-height:1.2;overflow-wrap:anywhere}
h3{font-size:17px;color:var(--gold);margin-bottom:9px}
.raw{font:12px/1.4 Consolas,monospace;color:var(--muted)}
.subtitle{color:var(--muted);margin-top:7px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:5px 7px;margin:11px 0 0;padding:0;list-style:none}
.stat{color:#dcf0df;font-size:13px;border:1px solid #405a48;background:#26382f;padding:3px 7px;border-radius:6px;white-space:nowrap}
.stat b{color:var(--green);font-variant-numeric:tabular-nums;font-weight:700}
.smallstats{margin:4px 0 0;gap:3px 5px}
.smallstats .stat{font-size:11px;padding:1px 5px}
.note{color:var(--muted);font-size:13px}
.description{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px;color:#e5e7dc}
.extra{margin-top:7px;color:var(--muted);font-size:13px}
.routes{display:grid;gap:10px;margin-top:10px}
.route{background:#161d19;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.route-header{display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:6px}
.route-label{color:var(--gold);font-size:13px;font-weight:650}
.tree{padding:0;margin:0;list-style:none}
.tree > li{border-left:1px solid #536459;margin:2px 0 2px 4px;padding:4px 0 4px 10px;position:relative;min-width:0}
.tree > li::before{content:"";position:absolute;top:16px;left:0;width:7px;border-top:1px solid #536459}
.tree summary{cursor:pointer;list-style-position:outside;margin-left:1px;overflow-wrap:anywhere;width:fit-content;max-width:100%}
.tree summary::marker{color:var(--green)}
.itemlink{color:var(--green);background:none;border:0;border-radius:3px;padding:0;text-align:left;font-weight:600;overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:.18em;text-decoration-color:#668a72}
.itemlink:hover{color:#def7e5}
.qty{color:var(--gold);margin-right:6px;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.retained{color:#f4deb1;font-size:11px;margin-left:5px}
.nested{margin:8px 0 3px 7px;padding-left:5px;border-left:1px solid #33453b}
.nested > div{margin:4px 0}
.info{margin-top:4px;padding-left:2px;color:var(--muted);font-size:12px}
.resultlinks{display:flex;flex-wrap:wrap;gap:6px 15px}
.notice{margin-top:8px;font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;padding:18px 0 25px;overflow-wrap:anywhere}
.foot details{margin-top:7px}
.foot summary{cursor:pointer}
@media(max-width:850px){
 header,.shell,.foot{width:calc(100% - 30px)}header{padding:24px 0 15px;align-items:start;flex-direction:column;gap:13px}.summary{gap:19px}.summary b{font-size:22px}
 .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:13px}.sidebar{position:static}.index{max-height:185px}
 .card{padding:15px}.route{padding:9px}.tree > li{padding-left:8px}
}
@media print{
 :root{color-scheme:light;--bg:#fff;--pane:#fff;--pane-2:#f2f2f2;--text:#202020;--muted:#404040;--line:#b5b5b5;--gold:#724900;--green:#214b2b}
 body,header,.selected,.card,.route,.stat,.grade{background:#fff;color:#1a1a1a}
 .stat b,.description{color:#1a1a1a}.sidebar{display:none}.shell{display:block}.card{margin-bottom:10px}
}
</style>
</head>

<script>
'use strict';
const data = JSON.parse(document.getElementById('route-data').textContent);
const items = data.items;
const byResult = new Map();
const usedBy = new Map();
const directProducts = new Set();
const specialProducts = new Set();
const materials = new Set();
for (const route of data.routes) {
  if (!byResult.has(route.result)) byResult.set(route.result, []);
  byResult.get(route.result).push(route);
  const special = route.note != null;
  (special ? specialProducts : directProducts).add(route.result);
  for (const [id] of route.ingredients) {
    if (!special) materials.add(id);
    if (!usedBy.has(id)) usedBy.set(id, new Set());
    usedBy.get(id).add(route.result);
  }
}
document.getElementById('recipe-count').textContent = data.registered;
document.getElementById('product-count').textContent = data.registeredResults;
document.getElementById('special-count').textContent = data.special;
document.getElementById('checksum').textContent = data.sha256;
const detail = document.getElementById('detail');
const index = document.getElementById('index');
const found = document.getElementById('found');
const search = document.getElementById('search');
const gradeSelect = document.getElementById('grade');
const modeButtons = [...document.querySelectorAll('[data-mode]')];
const grades = ['圣域神器','顶级神器','神器','传奇','史诗','勇者','稀有','精良','普通'];
for (const grade of grades.filter(g => Object.values(items).some(i => i.grade === g))) {
  gradeSelect.add(new Option(grade, grade));
}
const percent = new Set(['攻速','物理增伤','法术增伤','最终增伤','物理吸血','法术吸血']);
const order = new Intl.Collator('zh-Hans-CN');
const sorted = Object.keys(items).sort((a,b) => order.compare(items[a].name,items[b].name) || a.localeCompare(b));
let mode = 'products';
let selected = '';
const esc = value => String(value ?? '').replace(/[&<>"']/g,m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const named = id => esc(items[id].name);
const itemLink = id => '<a href="#'+esc(id)+'" class="itemlink" data-item="'+esc(id)+'">'+named(id)+'</a>';
const badge = grade => grade ? '<span class="grade" data-rank="'+esc(grade)+'">'+esc(grade)+'</span>' : '';
const normalized = s => String(s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');
const searchText = Object.fromEntries(sorted.map(id => [id,normalized([id,items[id].name,items[id].alt].join(' '))]));
function statList(stats,small = false) {
  return stats.length ? '<ul class="stats'+(small?' smallstats':'')+'" aria-label="已核对常驻属性">'+stats.map(([k,n]) =>
    '<li class="stat">'+esc(k)+' <b>'+(n>0?'+':'')+esc(n)+(percent.has(k)?'%':'')+'</b></li>').join('')+'</ul>' : '';
}
function routeTree(ingredients, route, path, depth) {
  return '<ul class="tree">'+ingredients.map(([id,qty]) => {
    const item = items[id];
    const html = '<span class="qty">×'+qty+'</span>'+itemLink(id)+(route.reusable===id?'<span class="retained">合成后保留</span>':'');
    const summaryStats = statList(item.stats,true);
    const child = depth < 13 && !path.has(id) ? (byResult.get(id) ?? []).filter(r => r.tree !== false) : [];
    const itemDetail = '<div class="info">'+itemLink(id)+' <span class="raw">'+esc(id)+'</span>'+summaryStats+
      (item.hints.length?'<p>'+esc(item.hints[0])+'</p>':'')+'</div>';
    if (!child.length) return '<li>'+html+summaryStats+(item.hints.length?'<p class="info">'+esc(item.hints[0])+'</p>':'')+'</li>';
    const next = new Set([...path,id]);
    const nested = child.map((r,i) => '<div><span class="route-label">'+esc(r.kind)+(child.length>1?' '+(i+1):'')+'</span>'+
      (r.note?'<p class="note">'+esc(r.note)+'</p>':'')+routeTree(r.ingredients,r,next,depth+1)+'</div>').join('');
    return '<li><details><summary>'+html+'</summary>'+itemDetail+'<div class="nested">'+nested+'</div></details>'+summaryStats+'</li>';
  }).join('')+'</ul>';
}
function detailHTML(id) {
  const i = items[id], routes = byResult.get(id) ?? [];
  let html = '<section class="card selected"><div class="title-row"><h2>'+named(id)+'</h2>'+badge(i.grade)+'<code class="raw">'+esc(id)+'</code></div>'+
    (i.alt?'<p class="subtitle">物品提示名 '+esc(i.alt)+'</p>':'')+
    (i.stats.length?statList(i.stats):'<p class="subtitle">常驻属性未见可单独核对的数值项。</p>')+'</section>';
  if (routes.length) {
    html += '<section class="card"><h3>合成与获取路线</h3><div class="routes">'+routes.map((route,n) =>
      '<article class="route"><div class="route-header"><div class="route-label">'+esc(route.kind)+(routes.length>1?' · 路线 '+(n+1):'')+'</div></div>'+
      (route.note?'<p class="note">'+esc(route.note)+'</p>':'')+
      routeTree(route.ingredients,route,new Set([id]),0)+'</article>').join('')+'</div></section>';
  }
  if (i.nativeEffects.length) {
    html += '<section class="card"><h3>已核对的原生能力数据</h3>'+
      i.nativeEffects.map(effect=>'<p class="notice">'+esc(effect)+'</p>').join('')+'</section>';
  }
  if (i.tooltip || i.extraText) {
    html += '<section class="card"><h3>原物品说明与效果</h3>'+
      (i.tooltip?'<div class="description">'+esc(i.tooltip)+'</div>':'')+
      (i.extraText?'<details class="extra"><summary>补充物编说明</summary><div class="description">'+esc(i.extraText)+'</div></details>':'')+'</section>';
  }
  if (usedBy.has(id)) {
    const next = [...usedBy.get(id)].sort((a,b)=>order.compare(items[a].name,items[b].name));
    html += '<section class="card"><h3>可用于制作</h3><div class="resultlinks">'+next.map(itemLink).join('')+'</div></section>';
  }
  if (i.hints.length) html += '<section class="card"><h3>已定位的掉落与任务来源</h3>'+
    i.hints.map(x=>'<p class="notice">'+esc(x)+'</p>').join('')+'</section>';
  return html;
}
function renderIndex() {
  const key = normalized(search.value);
  const selectedGrade = gradeSelect.value;
  const ids = sorted.filter(id => {
    if (selectedGrade && items[id].grade !== selectedGrade) return false;
    if (key) return searchText[id].includes(key);
    return mode === 'all' || (mode === 'products' && directProducts.has(id)) ||
      (mode === 'materials' && materials.has(id)) || (mode === 'special' && specialProducts.has(id));
  });
  found.textContent = '显示 '+ids.length+' / '+sorted.length+' 件';
  index.innerHTML = ids.map(id => '<button type="button" class="item-index" data-item="'+esc(id)+'" aria-current="'+(id===selected)+'">'+
    '<span>'+named(id)+'</span>'+badge(items[id].grade)+'</button>').join('') || '<p class="empty">未找到匹配的装备。</p>';
}
function selectItem(id,push = true,scroll = false) {
  if (!Object.hasOwn(items,id)) return;
  selected = id;
  detail.innerHTML = detailHTML(id);
  if (push && location.hash !== '#'+id) history.pushState(null,'','#'+id);
  renderIndex();
  if (scroll) detail.scrollIntoView({block:'start',behavior:'auto'});
}
for (const b of modeButtons) b.addEventListener('click',()=>{
  mode = b.dataset.mode;
  search.value = '';
  for (const option of modeButtons) option.setAttribute('aria-pressed',String(option===b));
  renderIndex();
  index.scrollTop = 0;
});
search.addEventListener('input',()=>{renderIndex();index.scrollTop=0;});
search.addEventListener('keydown',e=>{
  if (e.key === 'Enter') {
    const first=index.querySelector('[data-item]');
    if (first) selectItem(first.dataset.item,true,window.innerWidth<=850);
  }
});
gradeSelect.addEventListener('change',()=>{renderIndex();index.scrollTop=0;});
document.addEventListener('click',e=>{
  const link = e.target.closest('[data-item]');
  if (!link || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  selectItem(link.dataset.item,true,link.tagName==='A' || window.innerWidth<=850);
});
const fromHash = () => {
  try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; }
};
window.addEventListener('popstate',()=>selectItem(fromHash()||'I01S',false));
window.addEventListener('hashchange',()=>selectItem(fromHash()||'I01S',false));
selectItem(Object.hasOwn(items,fromHash())?fromHash():'I01S',false);
</script>
</body>
</html>
